name: Verificação
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run synth
      - run: python -m pip install -r requirements-validation.txt
      - run: npm run export:templates
      - run: cfn-lint -t .local/templates/*.json
      # CDK emits explicit Role dependencies already implied by GetAtt.
      - run: cfn-lint -i W3005 -t cdk.out/CloudArchitectMcpStack.template.json
      - run: npm audit --omit=dev
